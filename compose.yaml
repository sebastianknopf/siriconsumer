services:
  siriconsumer:
    build: .
    image: siriconsumer:local
    ports:
      - "8080:8080"
    environment:
      SIRI_STATE_DIR: /app/state
      SIRI_LOG_LEVEL: ${SIRI_LOG_LEVEL:-INFO}
      SIRI_DEBUG_SIRI_LOGGING: ${SIRI_DEBUG_SIRI_LOGGING:-false}
    volumes:
      - ./state:/app/state
      - ./output:/app/output
    restart: unless-stopped
